<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐搜索和下载工具</title>
    <link rel="icon" type="image/png" href="https://jsd-pro.yanjie233.top/gh/yanjie233/picx-images-hosting@master/icons8-yandex-音乐-50.8adhgbwwt4.webp">
    <style>
        :root {
            --primary-color: #ff3a3a;       /* 科技红 */
            --primary-hover: #ff5252;       /* 亮红 */
            --secondary-color: #2d3436;     /* 深灰 */
            --accent-color: #00d2d3;        /* 科技青 - 平衡色 */
            --bg-color: #121212;            /* 碳黑背景 */
            --card-color: rgba(30, 34, 40, 0.8); /* 蓝灰调卡片 */
            --text-color: #f5f6fa;          /* 亮白 */
            --secondary-text: #b2bec3;      /* 灰白 */
            --border-color: rgba(255, 255, 255, 0.1); /* 中性边框 */
            --input-bg: rgba(0, 0, 0, 0.3);
            --warning-color: rgba(255, 159, 67, 0.15); /* 橙色警告 */
            --warning-border: #ff9f43;
            --warning-text: #ff9f43;

            --glow: 0 0 15px rgba(255, 58, 58, 0.15);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 210, 211, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 58, 58, 0.08) 0%, transparent 25%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 科技感网格背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            font-weight: 300;
        }

        h1 span {
            color: var(--primary-color);
            text-shadow: 0 0 15px rgba(255, 58, 58, 0.4);
        }

        #searchForm {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background-color: var(--card-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
        }

        input, select, button {
            padding: 14px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: var(--input-bg);
            color: white;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: var(--glow);
            background-color: rgba(0, 0, 0, 0.6);
        }

        select option {
            background-color: #1a1a2e;
            color: white;
        }

        button {
            background: linear-gradient(135deg, #4b6584, #2d3436);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d3436, #4b6584);
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:hover::before {
            opacity: 1;
        }

        #results {
            list-style-type: none;
            padding: 0;
            display: grid;
            gap: 15px;
        }

        #results li {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: var(--glass-border);
            backdrop-filter: blur(5px);
        }

        #results li:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--primary-color);
            background-color: rgba(30, 35, 50, 0.85);
        }

        label {
            font-weight: 500;
            margin-top: 10px;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        .download-link, .play-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            margin-right: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            height: 36px;
            box-sizing: border-box;
            cursor: pointer;
            min-width: 80px;
        }

        .download-link:hover, .play-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 58, 58, 0.4);
        }

        .download-link.disabled, .play-btn:disabled, .play-btn.disabled {
            border-color: #444;
            color: #666;
            background-color: rgba(255, 255, 255, 0.02);
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }

        .loading {
            color: var(--primary-color);
            font-style: italic;
            text-align: center;
            margin: 20px 0;
        }
        
        #fail-reason {
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 8px;
            color: #ff6b81;
            font-size: 13px;
            display: none;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        #warning {
            background-color: var(--warning-color);
            border-left: 4px solid var(--warning-border);
            color: var(--warning-text);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-weight: 500;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* .play-btn styles merged with .download-link */

        #disclaimer {
            font-size: 12px;
            color: var(--secondary-text);
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-align: center;
            opacity: 0.7;
        }

        #admin-timer {
            font-size: 14px;
            color: var(--primary-color);
            margin-top: 10px;
            font-weight: bold;
            display: none;
            background-color: rgba(255, 58, 58, 0.1);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid rgba(255, 58, 58, 0.3);
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .song-info {
            display: flex;
            flex-direction: column;
        }
        
        .song-name {
            font-weight: bold;
            font-size: 1.1em;
            color: white;
            margin-bottom: 4px;
        }

        .song-artist {
            color: var(--secondary-text);
            font-size: 0.9em;
        }

        .cookie-status {
            text-align: center;
            color: var(--secondary-text);
            font-size: 13px;
            margin-top: 15px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color); 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color); 
        }
    </style>
</head>
<body>
    <div id="warning">
        本站仅供交流学习<br>使用前请先进行登录，否则无法下载会员歌曲
        <button id="close-warning-btn" style="position:absolute;top:8px;right:12px;background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--warning-text);transition:transform 0.2s;">×</button>
    </div>

    <h1><span>网易云音乐</span> 搜索和下载工具</h1>

    <div class="button-container">
        <button id="customCookieLoginButton" type="button">Cookie登录</button>
        <button id="clearCookieButton" type="button">解除登录状态</button>
        <button id="cookieHelpButton" type="button">登录教程</button>
        <button id="internalLoginButton" type="button">管理登录</button>
    </div>

    <form id="searchForm">
        <input type="text" id="searchInput" placeholder="输入歌曲名称或作者" required>
        
        <label for="limitSelect">搜索歌曲数量</label>
        <select id="limitSelect">
            <option value="5">5首</option>
            <option value="10">10首</option>
            <option value="20">20首</option>
            <option value="30">30首</option>
        </select>
        
        <label for="qualitySelect">下载音乐音质</label>
        <select id="qualitySelect">
            <option value="standard">标准音质</option>
            <option value="higher">较高音质</option>
            <option value="exhigh">极高音质</option>
            <option value="lossless">无损音质</option>
            <option value="hires">Hi-Res音质</option>
            <option value="jyeffect">高清环绕声</option>
            <option value="sky">沉浸环绕声</option>
            <option value="jymaster">超清母带</option>
        </select>
        
        <button type="submit">搜索</button>
    </form>

    <div id="fail-reason">
        无法获取的原因:你还没有登录，歌曲需要会员，你并没有会员，歌曲为数字专辑（受保护），你所选的音质，这个歌曲没有。<br>
        如果没有出现歌曲列表请稍等，正在获取。
    </div>

    <ul id="results"></ul>

    <div id="disclaimer">
        免责声明：本站不提供音乐解锁服务，下载会员歌曲，数字专辑需要你有会员或已购买专辑。<br>
    </div>
    
    <div id="admin-timer"></div>
    <div id="cookie-status" class="cookie-status"></div>

    <div id="player-container" style="position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(25, 25, 25, 0.95); padding: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); display: none; z-index: 1000; align-items: center; justify-content: center; border-top: 1px solid var(--primary-color); backdrop-filter: blur(10px);">
        <audio id="audioPlayer" controls style="width: 90%; max-width: 800px;"></audio>
        <button id="closePlayer" style="background: none; border: none; font-size: 24px; cursor: pointer; margin-left: 15px; color: var(--primary-color);">×</button>
    </div>

    <!-- 页脚 -->
    <footer style="text-align:center;color:var(--secondary-text);font-size:13px;margin-top:40px;opacity:0.6;">
        网易云音乐搜索下载V3 by 鄢杰 @2025 - 2026<br>
        特别致谢 NeteaseCloudMusicApi (已删库)
    </footer>

    <!-- 引入独立的认证脚本 -->
    <script src="https://music.yanjie233.top/auth"></script>
    
    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const limitSelect = document.getElementById('limitSelect');
        const qualitySelect = document.getElementById('qualitySelect');
        const results = document.getElementById('results');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value;
            const limit = limitSelect.value;
            const quality = qualitySelect.value;
            
            // 显示提示信息
            document.getElementById('fail-reason').style.display = 'block';
            
            const response = await fetch(`https://music.yanjie233.top/search?keywords=${encodeURIComponent(query)}&limit=${limit}`);
            const data = await response.json();

            results.innerHTML = '';
            if (data.result && data.result.songs) {
                const songs = data.result.songs;
                const songIds = songs.map(song => song.id).join(',');
                
                songs.forEach(song => {
                    const li = document.createElement('li');
                    const artists = song.artists.map(artist => artist.name).join(', ');
                    const filename = `${song.name} - ${artists}`;
                    li.innerHTML = `
                        <div class="actions">
                            <button class="play-btn" data-id="${song.id}" disabled>播放</button>
                            <a href="#" class="download-link loading" data-id="${song.id}" data-filename="${filename.replace(/"/g, '&quot;')}">获取中...</a>
                        </div>
                        <div class="song-info">
                            <div><strong>${song.name}</strong></div>
                            <div class="song-artist">${artists}</div>
                        </div>
                    `;
                    results.appendChild(li);
                });

                const downloadUrls = await getDownloadUrls(songIds, quality);

                document.querySelectorAll('li').forEach(li => {
                    const playBtn = li.querySelector('.play-btn');
                    const downloadLink = li.querySelector('.download-link');
                    if (!playBtn || !downloadLink) return;
                    
                    const songId = playBtn.getAttribute('data-id');
                    const url = downloadUrls[songId];

                    if (url) {
                        playBtn.disabled = false;
                        playBtn.onclick = () => {
                            const playerContainer = document.getElementById('player-container');
                            const audioPlayer = document.getElementById('audioPlayer');
                            playerContainer.style.display = 'flex';
                            audioPlayer.src = url;
                            audioPlayer.play();
                        };

                        downloadLink.href = url;
                        downloadLink.textContent = '下载';
                        downloadLink.classList.remove('loading');
                        
                        downloadLink.onclick = async (e) => {
                            e.preventDefault();
                            const filenameBase = downloadLink.getAttribute('data-filename');
                            let extension = 'mp3';
                            const match = url.match(/\.(\w+)(\?|$)/);
                            if (match) {
                                extension = match[1];
                            }
                            const filename = `${filenameBase}.${extension}`;

                            const originalText = downloadLink.textContent;
                            downloadLink.textContent = '下载中...';
                            
                            try {
                                const response = await fetch(url);
                                if (!response.ok) throw new Error('Network response was not ok');
                                const blob = await response.blob();
                                const blobUrl = window.URL.createObjectURL(blob);
                                
                                const a = document.createElement('a');
                                a.style.display = 'none';
                                a.href = blobUrl;
                                a.download = filename;
                                document.body.appendChild(a);
                                a.click();
                                window.URL.revokeObjectURL(blobUrl);
                                document.body.removeChild(a);
                            } catch (err) {
                                console.error('Download failed, falling back to direct link', err);
                                window.open(url, '_blank');
                            } finally {
                                downloadLink.textContent = originalText;
                            }
                        };
                    } else {
                        playBtn.textContent = '不可用';
                        playBtn.disabled = true;
                        
                        downloadLink.textContent = '不可用';
                        downloadLink.classList.remove('loading');
                        downloadLink.classList.add('disabled');
                        downloadLink.removeAttribute('href');
                    }
                });
            } else {
                results.innerHTML = '<li>未找到结果</li>';
            }
        });

        async function getDownloadUrls(ids, quality) {
            const response = await fetch(`https://music.yanjie233.top/song/url/v1?id=${ids}&level=${quality}`);
            const data = await response.json();
            const urlMap = {};
            data.data.forEach(item => {
                urlMap[item.id] = item.url;
            });
            return urlMap;
        }

        // 修正内部验证按钮逻辑
        document.addEventListener('DOMContentLoaded', () => {
            const internalLoginButton = document.getElementById('internalLoginButton');
            const adminTimer = document.getElementById('admin-timer');
            
            // 播放器相关逻辑
            const audioPlayer = document.getElementById('audioPlayer');
            const playerContainer = document.getElementById('player-container');
            const closePlayer = document.getElementById('closePlayer');

            if (closePlayer) {
                closePlayer.addEventListener('click', () => {
                    audioPlayer.pause();
                    playerContainer.style.display = 'none';
                });
            }

            if (internalLoginButton) {
                internalLoginButton.addEventListener('click', () => {
                    if (typeof adminLoginAndLog === 'function') {
                        adminLoginAndLog(
                            function onSuccess() {
                                // 登录成功时调用 /163api
                                var xhr = new XMLHttpRequest();
                                xhr.open('GET', '/163api', true);
                                xhr.onreadystatechange = function() {
                                    if (xhr.readyState === 4 && xhr.status === 200) {
                                        location.reload();
                                    }
                                };
                                xhr.send();
                            }
                        );
                    }
                });
            }
        });
        // 自定义Cookie登录相关
        const COOKIE_KEY = 'custom_music_cookie';
        const COOKIE_EXPIRE_KEY = 'custom_music_cookie_expire';
        const COOKIE_DAYS = 14;
        const cookieStatusDiv = document.getElementById('cookie-status');

        function setCustomCookie(cookie, days) {
            localStorage.setItem(COOKIE_KEY, cookie);
            const expire = Date.now() + days * 24 * 60 * 60 * 1000;
            localStorage.setItem(COOKIE_EXPIRE_KEY, expire);
            // 拆分每一项cookie并分别设置
            cookie.split(';').forEach(function(pair) {
                const eqPos = pair.indexOf('=');
                if (eqPos > 0) {
                    const name = pair.substring(0, eqPos).trim();
                    const value = pair.substring(eqPos + 1).trim();
                    document.cookie = `${name}=${value};path=/;max-age=${days*24*60*60}`;
                }
            });
        }

        function clearCustomCookie() {
            localStorage.removeItem(COOKIE_KEY);
            localStorage.removeItem(COOKIE_EXPIRE_KEY);
            // 清空所有自定义设置的cookie
            document.cookie.split(';').forEach(function(c) {
                const eqPos = c.indexOf('=');
                if (eqPos > 0) {
                    const name = c.substring(0, eqPos).trim();
                    document.cookie = name + '=;expires=' + new Date(0).toUTCString() + ';path=/';
                }
            });
        }

        function getCustomCookieExpire() {
            const expire = localStorage.getItem(COOKIE_EXPIRE_KEY);
            return expire ? parseInt(expire) : null;
        }

        function updateCookieStatus() {
            const expire = getCustomCookieExpire();
            if (expire && expire > Date.now()) {
                const leftMs = expire - Date.now();
                const leftDays = Math.floor(leftMs / (24*60*60*1000));
                const leftHours = Math.floor((leftMs % (24*60*60*1000)) / (60*60*1000));
                cookieStatusDiv.textContent = `Cookie登录有效期剩余: ${leftDays}天${leftHours}小时`;
            } else {
                cookieStatusDiv.textContent = '';
            }
        }

        // 警告框关闭与自动隐藏逻辑
        function checkAndHideWarning() {
            const warningDiv = document.getElementById('warning');
            const cookie = localStorage.getItem('custom_music_cookie');
            const expire = localStorage.getItem('custom_music_cookie_expire');
            if (cookie && expire && parseInt(expire) > Date.now()) {
                warningDiv.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const customCookieLoginButton = document.getElementById('customCookieLoginButton');
            const clearCookieButton = document.getElementById('clearCookieButton');
            const cookieHelpButton = document.getElementById('cookieHelpButton');

            if (customCookieLoginButton) {
                customCookieLoginButton.addEventListener('click', () => {
                    const cookie = prompt('请输入完整的网易云登录Cookie（如MUSIC_U=xxx; ...）');
                    if (cookie && cookie.trim()) {
                        setCustomCookie(cookie.trim(), COOKIE_DAYS);
                        alert('Cookie已保存，有效期14天。');
                        updateCookieStatus();
                    }
                });
            }

            if (clearCookieButton) {
                clearCookieButton.addEventListener('click', () => {
                    clearCustomCookie();
                    alert('已解除登录状态。');
                    updateCookieStatus();
                });
            }

            if (cookieHelpButton) {
                cookieHelpButton.addEventListener('click', () => {
                    window.open('https://jsd-pro.yanjie233.top/gh/yanjie233/picx-images-hosting@master/Cookie登录方式教程.39leotoite.webp', '_blank');
                });
            }

            // 关闭警告按钮
            const closeBtn = document.getElementById('close-warning-btn');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    document.getElementById('warning').style.display = 'none';
                });
            }

            checkAndHideWarning();
            updateCookieStatus();
        });
    </script>
</body>
</html>
